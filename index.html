<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Muczek i Przyjaciele."
    />
    <title>Muczek i Przyjaciele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <script data-goatcounter="https://muczek.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <body>
    <header class="site-header">
      <a class="logo" href="#top" aria-label="Muczek i Przyjaciele — strona główna">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>MUCZEK I PRZYJACIELE</span>
      </a>
      <nav aria-label="Główna nawigacja">
        <a href="#komiksy">Komiksy</a>
        <a href="#kontakt">Kontakt</a>
      </nav>
    </header>

    <main id="top">
      <section class="comics-section" id="komiksy" aria-labelledby="comics-title">
        <div class="comic-list">
          <article class="comic-card featured">
            <div class="comic-meta">
              <time datetime="2026-09-28">28.09.2026</time>
            </div>
            <div class="comic-caption">
              <h3>Nie przejmuj się</h3>
            </div>
            <button class="comic-image-button" type="button" aria-label="Powiększ komiks: Nie przejmuj się">
              <img
                src="assets/2026_09_nie_przejmuj_sie.png"
                alt="Trzykadrowy komiks. Muzyk martwi się, że ludzie nabiają się z niego na forum. Kolega słoń mówi mu, by się nie przejmował, po czym sam zaczyna się przejmować."
              />
              <span class="zoom-hint" aria-hidden="true">Powiększ ↗</span>
            </button>
          </article>

          <article class="comic-card">
            <div class="comic-meta">
              <time datetime="2026-09-21">21.09.2026</time>
            </div>
            <div class="comic-caption">
              <h3>Bezalkoholowe</h3>
            </div>
            <button class="comic-image-button" type="button" aria-label="Powiększ komiks: Bezalkoholowe">
              <img
                src="assets/2026_09_bezalkoholowe.png"
                alt="Dwukadrowy komiks. Klient bierze butelkę ze sklepowej półki, a sprzedawca przypomina mu, że jest bezalkoholowa."
              />
              <span class="zoom-hint" aria-hidden="true">Powiększ ↗</span>
            </button>
          </article>
        </div>
      </section>

      <section class="about" id="kontakt" aria-labelledby="about-title">
        <div class="about-label"><span>✳</span> Kontakt</div>
        <div>
          <h2 id="about-title">Cześć, tu Banaś.</h2>
          <p>Chcesz podzielic się czymś albo zamówić u mnie komiks?</p>
        </div>
        <a href="mailto:banasmaciek@gmail.pl">Napisz do mnie <span aria-hidden="true">↗</span></a>
      </section>
    </main>

    <footer>
      <a class="logo footer-logo" href="#top"><span class="logo-mark" aria-hidden="true"></span>MUCZEK I PRZYJACIELE</a>
      Odwiedziny: <span id="visit-count">...</span>
      <p>© 2026 Banas. Wszystkie kreski zastrzeżone.</p>
    </footer>

    <dialog class="lightbox" aria-label="Powiększony komiks">
      <button class="lightbox-close" type="button" aria-label="Zamknij">×</button>
      <img alt="" />
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
